name: firmware
on:
  push:
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install platformio==6.1.18 -r tests/requirements.txt
      - run: python3 scripts/validate_contract.py
      - run: python3 scripts/validate_firmware_format.py
      - run: python3 -m unittest discover -s tests -v
      - run: pio check -d firmware -e native --fail-on-defect high
      - run: pio test -d firmware -e native
      - run: pio run -d firmware -e seeed_xiao_esp32c3
